<div class="parcelle-map-container">
  <div class="map-header">
    <h3><i class="fas fa-map"></i> Carte des Parcelles</h3>
    <div class="map-controls">
      <button (click)="centerMap()" class="btn-control" title="Centrer la carte">
        <i class="fas fa-crosshairs"></i>
      </button>
      <button (click)="toggleFullscreen()" class="btn-control" title="Plein écran">
        <i class="fas" [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
      </button>
    </div>
  </div>

  <div class="map-wrapper" [class.fullscreen]="isFullscreen">
    <div id="parcelleMap" class="map"></div>

    <div class="map-legend">
      <h4>Légende</h4>
      <div class="legend-item">
        <span class="legend-marker active"></span>
        <span>Parcelles actives</span>
      </div>
      <div class="legend-item">
        <span class="legend-marker inactive"></span>
        <span>Parcelles inactives</span>
      </div>
      <div class="legend-item">
        <span class="legend-marker selected"></span>
        <span>Parcelle sélectionnée</span>
      </div>
    </div>

    <div class="map-info" *ngIf="selectedParcelle">
      <button (click)="closeInfo()" class="btn-close">
        <i class="fas fa-times"></i>
      </button>
      <h4>{{ selectedParcelle.nom }}</h4>
      <div class="info-details">
        <div class="info-item">
          <i class="fas fa-ruler-combined"></i>
          <span>{{ selectedParcelle.superficie }} ha</span>
        </div>
        <div class="info-item" *ngIf="selectedParcelle.typeSol">
          <i class="fas fa-mountain"></i>
          <span>{{ selectedParcelle.typeSol }}</span>
        </div>
        <div class="info-item" *ngIf="selectedParcelle.ville">
          <i class="fas fa-map-marker-alt"></i>
          <span>{{ selectedParcelle.ville }}</span>
        </div>
      </div>
      <button (click)="viewDetails()" class="btn btn-primary btn-sm">
        <i class="fas fa-eye"></i> Voir détails
      </button>
    </div>
  </div>

  <div class="map-loading" *ngIf="loading">
    <i class="fas fa-spinner fa-spin"></i>
    <p>Chargement de la carte...</p>
  </div>
</div>
