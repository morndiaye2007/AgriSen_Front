<!-- Barre de recherche pour les pays -->
<div class="search-container mb-3">
  <div class="input-group">
    <input type="text" class="form-control" placeholder="Rechercher un pays..." [(ngModel)]="searchTerm" (keyup)="applyFilter()">
    <button class="btn btn-outline-secondary" type="button" (click)="applyFilter()">
      <i class="feather icon-search"></i>
    </button>
  </div>
</div>

<!-- Conteneur avec barre de défilement verticale -->
<div class="table-container" style="max-height: 300px; overflow-y: auto;">
  <table mat-table [dataSource]="dataSource" matSort (matSortChange)="sortData($event)">

    <!-- Checkbox Column -->
    <ng-container matColumnDef="select">
      <th mat-header-cell *matHeaderCellDef>
        <!-- <mat-checkbox (change)="$event ? toggleAllRows() : null"
                      [checked]="selection.hasValue() && isAllSelected()"
                      [indeterminate]="selection.hasValue() && !isAllSelected()"
                      [aria-label]="checkboxLabel()">
        </mat-checkbox> -->
      </th>
      <td mat-cell *matCellDef="let row">
        <mat-checkbox (click)="$event.stopPropagation()"
                      (change)="$event ? selection.toggle(row) : null"
                      [checked]="selection.isSelected(row)"
                      [aria-label]="checkboxLabel(row)">
        </mat-checkbox>
      </td>
    </ng-container>

    <!-- Code Column -->
    <ng-container matColumnDef="code">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Code Pays </th>
      <td mat-cell *matCellDef="let element"> {{element?.code}} </td>
    </ng-container>

    <!-- Libelle Column -->
    <ng-container matColumnDef="libelle">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Libelle </th>
      <td mat-cell *matCellDef="let element"> {{element?.libelle}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"
        (click)="selection.toggle(row)">
    </tr>

    <!-- Row shown when there is no matching data -->
    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" colspan="3">Aucun pays ne correspond à la recherche "{{searchTerm}}"</td>
    </tr>
  </table>
</div>

<!-- Pagination -->
<div class="paginate mt-3">
  <ngb-pagination [collectionSize]="totalItems" [(page)]="pageOptions.page" [pageSize]="pageOptions.size" 
    [maxSize]="5" (pageChange)="paginate($event)" size="sm" [rotate]="true" 
    [ellipses]="true" [boundaryLinks]="true">
  </ngb-pagination>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="onFermer()">Fermer</button>
  <button type="button" class="btn btn-primary" (click)="onValider()" [disabled]="selection.isEmpty()">Valider</button>
</div>
