<table mat-table [dataSource]="dataSource">

  <!-- Selection Column - Radio pour ajout, Checkbox pour recherche -->
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <span *ngIf="!isMultipleSelection">Sélection</span>
      <mat-checkbox *ngIf="isMultipleSelection" 
                    (change)="$event ? toggleAllRows() : null"
                    [checked]="selection.hasValue() && isAllSelected()"
                    [indeterminate]="selection.hasValue() && !isAllSelected()"
                    [aria-label]="checkboxLabel()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <!-- Radio button pour ajout (sélection unique) -->
      <input *ngIf="!isMultipleSelection" 
             type="radio" 
             name="paysSelection" 
             [value]="row.id"
             (change)="onRadioChange(row)"
             [checked]="selectedPays?.id === row.id">
      
      <!-- Checkbox pour recherche (sélection multiple) -->
      <mat-checkbox *ngIf="isMultipleSelection"
                    (click)="$event.stopPropagation()"
                    (change)="$event ? selection.toggle(row) : null"
                    [checked]="selection.isSelected(row)"
                    [aria-label]="checkboxLabel(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="code">
    <th mat-header-cell *matHeaderCellDef> Code Pays </th>
    <td mat-cell *matCellDef="let element"> {{element?.code}} </td>
  </ng-container>

  <ng-container matColumnDef="libelle">
    <th mat-header-cell *matHeaderCellDef> Libelle </th>
    <td mat-cell *matCellDef="let element"> {{element?.libelle}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"
      (click)="isMultipleSelection ? selection.toggle(row) : onRadioChange(row)">
  </tr>

</table>

<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="onFermer()">Fermer</button>
  <button type="button" class="btn btn-primary" (click)="onValider()" [disabled]="isMultipleSelection ? selection.isEmpty() : !selectedPays">Valider</button>
</div>
