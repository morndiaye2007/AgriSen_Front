<div class="d-flex justify-content-between align-items-center flex-wrap grid-margin mb-1">

    <!-- Breadcrumb à gauche -->
    <nav class="page-breadcrumb cursor-pointer">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item active"><a>Liste des pays</a></li>
        </ol>
    </nav>

    <!-- Boutons à droite -->
    <div class="d-flex justify-content-end align-items-center gap-2">
        <button type="button" class="btn btn-secondary btn-icon me-2" (click)="openAddPays(SearchPaysModal)">
            <i class="feather icon-search"></i>
        </button>
        <button type="button" class="btn btn-primary btn-icon-text" (click)="openAddPays(addPaysModal)">
            <i class="feather icon-plus-circle"></i>&nbsp;&nbsp; Nouveau pays
        </button>
    </div>

</div>

<div class="card mt-4">
    <div class="card-body p-0">
        <section class="table-container mat-elevation-z8" tabindex="0">
            <!-- <app-spinner *ngIf="loadingIndicator" [displayedColumns]="displayedColumns"></app-spinner> -->

            <table mat-table [dataSource]="dataSource?.payload">
                <ng-container matColumnDef="code">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text" style="width:50px;">Code lll Pays</th>
                    <td mat-cell *matCellDef="let pays" class="text-left"> {{pays?.code}} </td>
                </ng-container>

    
                <ng-container matColumnDef="libelle">
                    <th mat-header-cell *matHeaderCellDef class="table-head-text text-center" style="width:350px;">
                        Libelle lll</th>
                    <td mat-cell *matCellDef="let pays" class="text-center"> {{pays?.libelle}} </td>
                </ng-container>
                     
                <ng-container matColumnDef="actions" stickyEnd>
                    <th mat-header-cell *matHeaderCellDef class="table-head-text" style="width:50px;">
                        Actions </th>
                    <td mat-cell *matCellDef="let pays">
                        <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                            <mat-icon>more_vert</mat-icon>
                        </button>
                        <mat-menu #menu="matMenu">
                            <button mat-menu-item (click)="openEditPays(EditPaysModal, pays)">
                                <mat-icon>edit</mat-icon>
                                <span>Modifier</span>
                            </button>
                            <button mat-menu-item (click)="deletePays(pays.id)">
                                <mat-icon>delete</mat-icon>
                                <span>Supprimer</span>
                            </button>
                        </mat-menu>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="table-head-bg"></tr>
                <tr mat-row *matRowDef="let emprow; columns: displayedColumns"></tr>
            </table>

            <span *ngIf="dataSource?.payload?.length == 0" class="paginate text-danger mt-4">Les critères de recherche
                tels qu'énoncés ne correspondent à aucun pays</span>

            <div class="paginate">
                <ngb-pagination [collectionSize]="dataSource?.metadata?.totalElements" [page]="pageOptions.page+1"
                    [pageSize]="pageOptions.size" [maxSize]="5" (pageChange)="paginate($event)" size="sm"
                    [rotate]="true" [ellipses]="true" [boundaryLinks]="true">
                </ngb-pagination>
            </div>
        </section>
    </div>
</div>


<!-- search pays -->
<ng-template #SearchPaysModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Recherche Pays</h5>
        <button type="button" class="btn-close"  (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-add-pays (search)="doSearch($event)" [isSearch]="true" (submit)="close()"></app-add-pays>
    </div>
</ng-template>
<!-- search pays -->

<!--Add pays-->
<ng-template #addPaysModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Ajout Pays</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-add-pays [isSearch]="false" (submit)="close()"></app-add-pays>
    </div>
</ng-template>
<!--End Add pays-->

<!--Edit pays-->
<ng-template #EditPaysModal let-modal>
    <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Modifier Pays</h5>
        <button type="button" class="btn-close" (click)="modal.close('by: close icon')" aria-label="Close"></button>
    </div>
    <div class="modal-body">
        <app-add-pays  (submit)="close()" [paysToUpdate]="paysToUpdate"></app-add-pays>
    </div> 
</ng-template>
<!--End Edit pays-->
