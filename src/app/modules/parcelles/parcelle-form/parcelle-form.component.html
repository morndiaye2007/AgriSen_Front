<div class="parcelle-form-container">
  <h1>{{ isEditMode ? 'Modifier la Parcelle' : 'Nouvelle Parcelle' }}</h1>

  <mat-card>
    <mat-card-content>
      <form [formGroup]="parcelleForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Nom de la parcelle</mat-label>
              <input matInput formControlName="nom" placeholder="Ex: Champ A - Route Baobab">
              <mat-error *ngIf="parcelleForm.get('nom')?.hasError('required')">
                Nom requis
              </mat-error>
            </mat-form-field>
          </div>
          <div class="col-md-6">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Taille (Hectares)</mat-label>
              <input matInput type="number" formControlName="taille" step="0.1">
              <mat-error *ngIf="parcelleForm.get('taille')?.hasError('required')">
                Taille requise
              </mat-error>
            </mat-form-field>
          </div>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Région</mat-label>
          <input matInput formControlName="region" placeholder="Dakar, Thiès, etc.">
          <mat-error *ngIf="parcelleForm.get('region')?.hasError('required')">
            Région requise
          </mat-error>
        </mat-form-field>

        <div class="map-section">
          <h3>Coordonnées GPS</h3>
          <p>Cliquez sur la carte pour définir l'emplacement</p>
          <div class="map-container">
            <div leaflet [leafletOptions]="mapOptions" (leafletMapClick)="onMapClick($event)">
              <!-- <div [leafletMarker]="selectedCoordinates"></div> -->
            </div>
          </div>
          <div class="row mt-3">
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Latitude</mat-label>
                <input matInput formControlName="latitude" type="number" step="0.0001">
              </mat-form-field>
            </div>
            <div class="col-md-6">
              <mat-form-field appearance="outline" class="full-width">
                <mat-label>Longitude</mat-label>
                <input matInput formControlName="longitude" type="number" step="0.0001">
              </mat-form-field>
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button mat-button type="button" routerLink="/dashboard/parcelles">
            Annuler
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="parcelleForm.invalid">
            {{ isEditMode ? 'Modifier' : 'Créer' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
