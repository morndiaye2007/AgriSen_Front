<div class="marketplace-container">
  <div class="header-section">
    <h1>Marché Agricole</h1>
    <button mat-raised-button color="primary">
      <mat-icon>add</mat-icon>
      Vendre un Produit
    </button>
  </div>

  <div class="row">
    <div class="col-md-3">
      <mat-card>
        <mat-card-content>
          <h3>Filtres</h3>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Catégories</mat-label>
            <mat-select [(value)]="selectedCategory" (selectionChange)="filterByCategory()">
              <mat-option *ngFor="let cat of categories" [value]="cat.value">
                {{ cat.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </mat-card-content>
      </mat-card>
    </div>
    <div class="col-md-9">
      <div class="products-grid">
        <mat-card *ngFor="let produit of filteredProduits" class="product-card" (click)="viewProduct(produit.id)">
          <img mat-card-image [src]="produit.imageUrl" [alt]="produit.nom">
          <mat-card-content>
            <h3>{{ produit.nom }}</h3>
            <p>{{ produit.vendeurNom }}</p>
            <p class="price">{{ produit.prix | number }} XOF / {{ produit.unite }}</p>
          </mat-card-content>
          <mat-card-actions>
            <button mat-button color="primary">Voir les Détails</button>
          </mat-card-actions>
        </mat-card>
      </div>
    </div>
  </div>
</div>
