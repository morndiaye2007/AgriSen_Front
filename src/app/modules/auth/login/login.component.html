<div class="auth-container">
  <div class="row w-100 mx-0">
    <div class="col-md-6 col-lg-5 col-xl-4 mx-auto">
      <mat-card class="auth-card">
        <mat-card-header>
          <div class="logo-container">
            <mat-icon class="logo-icon">eco</mat-icon>
            <h2 class="logo-text">AgriSénégal</h2>
          </div>
          <mat-card-title>Connexion</mat-card-title>
          <mat-card-subtitle>Connectez-vous à votre compte</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput type="email" formControlName="email" placeholder="votre@email.com">
              <mat-icon matPrefix>email</mat-icon>
              <mat-error *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
                Email requis
              </mat-error>
              <mat-error *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
                Email invalide
              </mat-error>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Mot de passe</mat-label>
              <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
              <mat-icon matPrefix>lock</mat-icon>
              <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
                <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
              <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
                Mot de passe requis
              </mat-error>
              <mat-error *ngIf="loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched">
                Minimum 6 caractères
              </mat-error>
            </mat-form-field>

            <div class="form-actions">
              <a routerLink="/auth/forgot-password" class="forgot-link">Mot de passe oublié ?</a>
            </div>

            <button mat-raised-button color="primary" type="submit" class="full-width submit-btn" [disabled]="loading">
              <mat-spinner diameter="20" *ngIf="loading" class="spinner-inline"></mat-spinner>
              <span *ngIf="!loading">Se connecter</span>
            </button>
          </form>
        </mat-card-content>

        <mat-card-footer>
          <p class="text-center">
            Pas encore de compte ? 
            <a routerLink="/auth/register" class="link-primary">S'inscrire</a>
          </p>
        </mat-card-footer>
      </mat-card>
    </div>
  </div>
</div>
